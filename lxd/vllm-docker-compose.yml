# llm-server의 /opt/vllm/docker-compose.yml
# 2x RTX 3090 (PCIe, NVLink 없음) + Qwen3-30B-A3B (MoE, BF16)
# 변경: Qwen3-32B-AWQ → Qwen3-30B-A3B
#   - 128K 네이티브 context (SVG 생성에 필수)
#   - 활성 파라미터 3B (빠른 추론)
#   - 비양자화 BF16 (코드/SVG 품질 우수)
services:
  vllm:
    image: vllm/vllm-openai:latest
    runtime: nvidia
    ipc: host                    # TP에서 프로세스 간 통신에 필수
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NCCL_P2P_DISABLE=1      # NVLink 없으므로 P2P 비활성화 (PCIe 사용)
    volumes:
      - /models:/models
      - huggingface_cache:/root/.cache/huggingface
    ports:
      - "8080:8000"
    command: >
      --model /models/Qwen3-30B-A3B
      --tensor-parallel-size 2
      --max-model-len 32768
      --gpu-memory-utilization 0.85
      --trust-remote-code
      --disable-log-requests
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s  # 모델 로딩 시간 고려

volumes:
  huggingface_cache:
