server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://static.cloudflareinsights.com https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.openai.com https://www.google-analytics.com https://analytics.google.com https://stats.g.doubleclick.net;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SEO: sitemap and robots.txt proxied to Django
    location = /sitemap.xml {
        proxy_pass http://backend:8000/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /robots.txt {
        proxy_pass http://backend:8000/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # allauth OAuth 플로우 (소셜 로그인 리다이렉트)
    location /accounts/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # API proxy
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # SSE chatbot (long-lived connection)
    location /api/chat/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Media files (served directly from Docker volume)
    # ^~ prevents regex location blocks from overriding this
    location ^~ /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Static files
    location /static/ {
        proxy_pass http://backend:8000;
    }

    # Gzip
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Cache static assets (Vite hashed filenames)
    # expires와 add_header를 같이 쓰면 Cache-Control이 두 줄로 나간다. 한 줄로 못 박는다.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 없는 자산의 404는 절대로 캐시되면 안 된다.
    #
    # 2026-08-17 장애의 원인이 여기였다. 복제본이 2개고 maxSurge=1이라
    # 롤링 업데이트 중에 구 파드와 신 파드가 잠시 함께 산다. 그 사이에
    # 신 파드가 준 index.html이 참조하는 새 번들을 구 파드가 받으면 404가 난다.
    # 원본이 캐시 지시를 안 주면 CDN이 그 404를 4시간 동안 물고 있는다.
    # 그때부터 모든 방문자에게 번들이 404로 나가고, 스크립트가 아예 실행되지
    # 않으니 JS 예외도 없이 화면만 빈다. 롤백하면 옛 번들이 캐시 적중이라
    # 즉시 살아나서 원인을 엉뚱한 곳에서 찾게 된다.
    error_page 404 = @notfound;
    location @notfound {
        expires off;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        default_type text/plain;
        return 404 "not found\n";
    }

    # Health check endpoint
    location /nginx-health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
